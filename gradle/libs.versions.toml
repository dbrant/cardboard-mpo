[versions]
core-ktx = "1.19.1"
espresso-core = "3.7.0"
gradle = "9.4.1"
gradle-toolchains-foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
kotlin-gradle-plugin = "2.4.21"
material = "1.14.0"
